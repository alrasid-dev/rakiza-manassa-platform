name: Rakiza Cron Jobs (متكررة)

on:
  schedule:
    # كل ساعة (بدلاً من كل 15 دقيقة) لتقليل استهلاك قاعدة البيانات؛ المهام الثلاث لا تحتاج تردد 15 دقيقة.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rakiza-cron-jobs
  cancel-in-progress: false

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Time-Sensitive Jobs
        run: |
          BASE_URL="${{ secrets.RAKIZA_BASE_URL }}"
          CRON_SECRET="${{ secrets.RAKIZA_CRON_SECRET }}"

          JOBS=(
            "internal-mail-dispatch"
            "auto-resume-tasks"
            "mark-overdue-tasks"
          )

          for JOB in "${JOBS[@]}"; do
            echo "Running: $JOB"
            curl -X POST "${BASE_URL}/api/scheduled/${JOB}" \
              -H "x-cron-secret: ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --max-time 60 \
              --silent --show-error || echo "Failed: $JOB"
          done
